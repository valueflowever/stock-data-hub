[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-data-hub"
version = "0.6.0"
description = "Region-aware, multi-source stock market data with automatic fallback."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.14.0",
    "pandas>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.4",
]
service = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
indicators = [
    "TA-Lib>=0.6.5,<0.8",
]
sources = [
    "tickflow[all]",
    "efinance",
    "baostock",
    "pytdx>=1.72",
    "yfinance>=1.0.0",
]

[project.scripts]
stock-data-hub = "stock_data_hub.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
