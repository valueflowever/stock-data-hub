name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.profile }} / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            profile: core
            extras: dev
          - os: windows-latest
            python: "3.12"
            profile: core
            extras: dev
          - os: ubuntu-latest
            python: "3.10"
            profile: full
            extras: dev,service,indicators,sources
          - os: windows-latest
            python: "3.12"
            profile: full
            extras: dev,service,indicators,sources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pytest -q
        env:
          STOCK_DATA_HUB_REQUIRE_EXTRAS: ${{ matrix.profile }}

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build ruff
      - run: python -m ruff check src tests
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
